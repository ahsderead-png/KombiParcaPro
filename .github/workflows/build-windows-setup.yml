name: Windows Setup Derle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Uygulamayı yayınla
        run: dotnet publish KombiParcaPro/KombiParcaPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Inno Setup ile kurulum dosyasını oluştur
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Installer\KombiParcaPro.iss'
      - name: Kurulum dosyasını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: KombiParcaPro-Windows-Setup
          path: SetupOutput/KombiParcaPro_Setup_v2.3.0_x64.exe
      - name: Güncel sürüme ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KombiParcaPro v1.0.${{ github.run_number }}
          files: SetupOutput/KombiParcaPro_Setup_v2.3.0_x64.exe
          generate_release_notes: true
